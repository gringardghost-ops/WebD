<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        position: relative;
        height: 200px;
        border: 2px solid black;
        background-color: aliceblue;
      }

      .child {
        position: relative;
        top: 50px;
        left: 350px;
        background-color: aqua;
      }

      .box {
        height: 50px;
        background: gray;
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="child">CHILD</div>
    </div>
    <div class="box">BOX BELOW</div>
  </body>
</html>
