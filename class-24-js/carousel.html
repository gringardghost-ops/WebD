<!DOCTYPE html>
<html lang="en">
<head>
<style>
    #parent {
        display: flex;
        justify-content: center;
    }

    #main {
        margin: 6px;
        height: 200px;
        width: 995px;
        border: 2px solid black;
        overflow: hidden;
    }

    #track {
        display: flex;
        width: max-content;
        animation: scrol 10s linear infinite;
        
    }

    .grp {
        display: flex;
        flex-shrink: 0;
    }

    .one {
        width: 150px;
        height: 190px;
        background-color: aquamarine;
        margin: 6px;
        
        
    }

    @keyframes scrol {
        from {
            transform: translateX(0);
        }

        to {
            transform: translateX(-50%);
        }
    }
</style>
</head>

<body>
    <div id="parent">
        <div id="main">
            <div id="track">
                <div class="grp">
                    <div class="one">1</div>
                    <div class="one">2</div>
                    <div class="one">3</div>
                    <div class="one">4</div>
                    <div class="one">5</div>
                    <div class="one">6</div>
                </div>

                <div class="grp">
                    <div class="one">1</div>
                    <div class="one">2</div>
                    <div class="one">3</div>
                    <div class="one">4</div>
                    <div class="one">5</div>
                    <div class="one">6</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
