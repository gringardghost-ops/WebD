<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            display: inline-block;
        }
        #one{
            background-color: dodgerblue;
        }
        #two{
            background-color: magenta;
            transition:30s;
        }
        #two:hover{
            background-color: aqua;
            /* position: absolute; */
            top: 208px;
            left: 204px;

        }
        #three{
            background-color:chartreuse;
        }
    </style>
</head>
<body>
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    
</body>
</html>
