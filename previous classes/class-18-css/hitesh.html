<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GALLERY</title>
    <style>
        img {
            height: 270px;
            width: 470px;
            margin: 3px;
            border: 1px solid black;
            transition: 0.5s;
            opacity: 0.8;
            border-radius: 10px;
        }

        div {
            margin: 3px;
        }

        #main {
            display: grid;
            gap: 10px;

            height: 80vh;
            grid-template-columns: repeat(3, 470px);
        }

        img:hover {
            transform: scale(1.03);
            opacity: 1;
            border: 1px solid whitesmoke;
            border-radius: 0;
            margin: 4px;
            border-radius: 10px;

        }

        hr {
            height: 5px;
            background-color: rgb(76, 174, 236);
            border: none;

        }

        h1 {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            padding-left: 10px;
        }

        p {
            color: darkgray;
            padding-left: 10px;
        }

        #first {
            grid-column: span 3;
            grid-row: span 1;
            position: relative;
        }

        #first img {
            object-fit: cover;
            height: 440px;
            width: 97vw;
            overflow: hidden;
        }

        #first span {
            position: absolute;
            color: white;
            left: 30px;
            bottom: 70px;
            font-size: 40px;
            opacity: 0;
        }

        #first:hover span {
            z-index: 10;
            opacity: 1;
            transform: translateY(-20px);
        }
    </style>
</head>

<body bgcolor="black">
    <p>MY COLLECTION</p>
    <h1>Moments.</h1>
    <p>A collection of places, people and memories.</p>
