<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System and web Basics</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            background-color: aqua;
        }
        div:hover{
            animation-name: vow ;
            animation-duration: 4s;
        }
        @keyframes vow{
            0%{
                background-color: bisque;
                height: 25vh;
            }
            25%{
                background-color: burlywood;
                height: 50vh;
                width: 50vw;
            }
            50%{
                background-color: aqua;
                height: 75vh;
                width: 75vw;
            }
            100%{
                background-color: blueviolet;
                height: 100vh;
                width: 100vw;
            }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
