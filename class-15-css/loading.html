<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loading</title>
    <style>
        body{
            margin: 0px;
            padding: 0px;
            background-color: black;
        }
        #main{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            height: 100vh;
            width: 100vw;
            background-color: black;
            border-radius: 0%;
        }
        div{
            height: 100px;
            width: 100px;
            border-radius: 50%;
            margin: 25px;
        }
        #one{
            background: linear-gradient(orange,rgb(255, 82, 30),rgb(255, 115, 0));
            animation-name: b1;
            animation-duration: 850ms;
            animation-direction: alternate;
            animation-iteration-count: infinite;
            animation-timing-function: ease-out;
        }
        #two{
            background: linear-gradient(rgb(0, 64, 255),rgb(30, 116, 255),rgb(0, 200, 255));
            animation-name: b2;
            animation-duration: 850ms;
            animation-direction: alternate;
            animation-iteration-count: infinite;
            animation-timing-function: ease-out;
            animation-delay: 250ms;
        }
        #three{
            background: linear-gradient(rgb(255, 0, 123),rgb(255, 59, 190),rgb(251, 80, 237));
            animation-name: b3;
            animation-duration: 850ms;
            animation-direction: alternate;
            animation-iteration-count: infinite;
            animation-timing-function: ease-out;
            animation-delay: 500ms;

        }
        @keyframes b1 {
            0%{
                transform: translateY(100px) scale(1);
                opacity: 0.5;
            }
            100%{
                transform: translateY(0px) scale(1.3);
                opacity: 1;
            }
        }
        @keyframes b2 {
            0%{
                transform: translateY(100px) scale(1);
                opacity: 0.5;
            }
            100%{
                transform: translateY(0px) scale(1.3);
                opacity: 1;
            }
        }
        @keyframes b3 {
            0%{
                transform: translateY(100px) scale(1);
                opacity: 0.5;
            }
            100%{
                transform: translateY(0px) scale(1.3);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <center>
        <div id="main">
            <div id="one"></div>
            <div id="two"></div>
            <div id="three"></div>
        </div>
    </center>
</body>
</html>
