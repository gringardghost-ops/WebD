<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            height: 90vh;
            border: 1px solid;
            display: grid;
            grid-template-columns: 100px 200px;
        }
        .q{
            border: 1px solid pink;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div class="q" id="one">1</div>
        <div class="q" id="two">2</div>
        <div class="q" id="three">3</div>
        <div class="q" id="four">4</div>
        <div class="q" id="five">5</div>
        <div class="q" id="six">6</div>
    </div>
</body>
</html>
