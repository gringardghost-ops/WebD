<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0px;
        }
        nav{
            height: 100px;
            background-color: black;
            color: antiquewhite;
            display: flex;
            justify-content:left;
            align-items: center;
            justify-content: space-between;
        }
        #logo{
            margin-left: 20px;
            font-size: 28px;
        }
        a{
            /* padding: 10px; */
            text-decoration: none;
            color: beige;
            font-size: 24px;
        }
        #text{
            /* background-color: aqua; */
            height: 100%;
            width: 50%;
            display: flex;
            justify-content: end;
            align-items: center;
            justify-content: space-between;
            /* justify-content: space-evenly; */
        }
        button{
            height: 40px;
            width: 100px;
            background-color: rgb(241, 249, 0);
            padding-right: 10px;
            border: none;
            margin-right: 10px;
            border-radius: 11px;
        }
        button:hover{
            background-color: black;
            border: 1px solid rgb(241, 249, 0);
            color: rgb(241, 249, 0);
        }


    </style>
</head>
<body>
    <nav>
        <div id="logo">LOGO</div>
        <div id="text">
            <a href="#">About us</a> 
            <a href="#">Portfolio</a> 
            <a href="#">Services</a>
            <button>Contact us</button>
        </div>
    </nav>
</body>
</html>
