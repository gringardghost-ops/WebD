<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="assingment.css" />
  </head>
  <body>
    <!-- <center> -->
      <header>
        <div id="navbar">
          <nav>
            <span id="logo1"><h3>Tech<span id="logo2">Conf</span></h3></span>
            <a href="#" target="_blank">Home</a>
            <a href="#" target="_blank">Speaker</a>
            <a href="#" target="_blank">Schedule</a>
            <a href="#" target="_blank">Register</a>
            <button>Register</button>
          </nav>
        </div>
        <p id="rgn">REGISTER NOW</p>
        <h1>Conference Registration</h1>
        <p>
          Fill in the details below to secure your spot at Tech Conference 2026.
        </p>
      </header>

      <div id="topcard">
        <div class="cr1">
          <fieldset class="crr1">
            <label>Personal Information</label><br />
            <label>Full name <span class="req">*</span></label
            ><br />
            <input type="text" placeholder="Full name" /> <br />
            <label>Email <span class="req">*</span></label
            ><br />
            <input type="email" placeholder="Email" /><br />
            <label>Phone NO. <span class="req">*</span></label
            ><br />
            <input type="number" placeholder="Ex:9512346780" /><br />
            <label>Date of birth <span class="req">*</span></label
            ><br />
            <input type="date" pl /><br />
            <label>Gender <span class="req">*</span></label
            ><br />
            <label><input type="radio" name="Gender" />Male</label>
            <label> <input type="radio" name="Gender" />Female</label>
            <label><input type="radio" name="Gender" />Other</label>
          </fieldset>
        </div>
        <div class="cr1">
          <fieldset class="crr1">
            <label>Conference Preferences</label><br />
            <label>Ticket Type <span class="req">*</span></label
            ><br />
            <label><input type="radio" name="Ticket" />Student</label>
            <label><input type="radio" name="Ticket" />Professional</label>
            <label><input type="radio" name="Ticket" />VIP</label><br />
            <label>Areas of interest <span class="req">*</span></label
            ><br />
            <label><input type="checkbox" name="interest" />AI</label><br />
            <label><input type="checkbox" name="interest" />WebDev</label><br />
            <label><input type="checkbox" name="interest" />Cloud</label><br />
            <label><input type="checkbox" name="interest" />Cybersecurity</label
            ><br />
            <label><input type="checkbox" name="interest" />Data Science</label
            ><br />
            <label>Workshop Selection</label><br />
            <label>Select Workshop <span class="req">*</span></label
            ><br />øø
            <select name="Workshop">
              <option value="React advanced Pattern">
                React advanced Pattern
              </option>
              <option value="React advanced Pattern">
                React advanced Pattern
              </option>
              <option value="React advanced Pattern">
                React advanced Pattern
              </option>
            </select>
          </fieldset>
        </div>
      </div>
      <br>
      <div id="bottomcard">
        <div class="cr2">
          <fieldset>
            <label>Account Information</label> <br />
            <label>Username <span class="req">*</span> </label><br />
            <input type="text" name="Username" placeholder="Username" /> <br />
            <label>Password <span class="req">*</span></label> <br />
            <input type="password" placeholder="Password" /><br />
            <label>Confirm Password<span class="req">*</span> </label><br />
            <input type="password" placeholder="Confirm Password" />
          </fieldset>
        </div>
        <div class="cr2">
          <fieldset>
            <label>Additional Information</label><br />
            <input type="text" placeholder="Enter your text here" /><br />
            <label
              ><input type="checkbox" />I agree to the
              <a href="#" target="_blank">terms and conditions</a
              ><span class="req">*</span></label
            ><br />
            <button>Submit Registration</button>
          </fieldset>
        </div>
      </div>
    </center>
  </body>
</html>
